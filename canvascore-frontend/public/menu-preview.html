<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Live menu preview of the Menu Builder. Loaded in a sandboxed iframe (scripts allowed, no same origin), so the
     menu's own scripts run here without ever reaching the editor; the editor's strict policy stays strict. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; img-src * data: blob:; font-src * data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Menu preview</title>
<script>
  window.addEventListener('message', function (e) {
    if (e.source !== window.parent || !e.data || e.data.type !== 'cc-menu-preview' || typeof e.data.html !== 'string') return;
    document.open();
    document.write(e.data.html);
    document.close();
  });
</script>
</head>
<body></body>
</html>

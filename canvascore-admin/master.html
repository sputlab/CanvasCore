<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="{{BASE_URL}}">

    <title>{{PAGE_TITLE}}</title>
    <meta name="description" content="{{META_DESCRIPTION}}">

    {{GOOGLE_FONTS}}

    <style>
        :root {
            --brand-color: {{BRAND_COLOR}};
            --font-family: '{{FONT_FAMILY}}', sans-serif;
        }

        body {
            margin: 0; padding: 0;
            font-family: var(--font-family);
            background: #ffffff; color: #0f172a;
            overflow-x: clip;
        }
        * { box-sizing: border-box; }

        /* Gli stili del menu sono generati interamente dal Menu Builder (compiler).
           Nessuna regola globale qui per non entrare in conflitto. */

        @media (max-width: 768px) {
            .cc-img-text { flex-direction: column !important; }
        }

        /* ====== ANIMATIONS ====== */
        .cc-reveal {
            opacity: 0;
            visibility: hidden;
            transition: all 0.8s cubic-bezier(0.5, 0, 0, 1);
            will-change: opacity, transform;
        }

        .cc-reveal.fade-up { transform: translateY(50px); }
        .cc-reveal.fade-in { transform: translateY(0); }
        .cc-reveal.zoom-in { transform: scale(0.92); }

        .cc-reveal.is-visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }
    </style>
</head>
<body>

    <header>
        {{MAIN_MENU}}
    </header>

    <main>
        {{PAGE_CONTENT}}
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const revealElements = document.querySelectorAll('.cc-reveal');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.15, rootMargin: "0px 0px -50px 0px" });
            revealElements.forEach(el => observer.observe(el));
        });
    </script>
</body>
</html>
